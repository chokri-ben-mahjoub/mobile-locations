name: locations_app
description: "LocaTrack - Gestion des contrats de location"
publish_to: 'none'

version: 1.3.0+5

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Local database (local-first)
  drift: ^2.23.1
  sqlite3_flutter_libs: ^0.5.33
  path_provider: ^2.1.5
  path: ^1.9.1

  # Preferences (réglages / rappels)
  shared_preferences: ^2.3.4

  # Notifications locales (rappel d'expiration de contrat)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Utils
  intl: ^0.20.3
  uuid: ^4.5.1
  collection: ^1.19.1
  crypto: ^3.0.6

  # Authentification locale
  local_auth: ^2.3.0

  # Sauvegarde / restauration des données
  share_plus: ^10.1.4
  file_picker: ^10.3.3

  # Pièces jointes (photos contrat, CIN, état des lieux...)
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.14
  drift_dev: ^2.23.1

flutter:
  uses-material-design: true

  # Police Inter embarquée (licence OFL : assets/fonts/LICENSE.txt), 100 % hors ligne
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
